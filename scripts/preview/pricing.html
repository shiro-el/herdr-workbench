<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pricing · Acme Cloud</title>
<style>
  :root { --bg:#0f1117; --card:#171a23; --line:#262a36; --text:#e8eaf0; --dim:#8b91a3; --accent:#6b93ff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background: radial-gradient(1200px 500px at 50% -120px, #23305a 0%, var(--bg) 60%); color:var(--text); }
  nav { display:flex; align-items:center; gap:28px; padding:22px 40px; font-size:14px; color:var(--dim); }
  nav b { color:var(--text); font-size:16px; margin-right:auto; display:flex; align-items:center; gap:10px; }
  nav b i { width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,#6b93ff,#a77bff); display:inline-block; }
  header { text-align:center; padding:36px 20px 10px; }
  h1 { font-size:40px; margin:0 0 10px; letter-spacing:-0.5px; }
  header p { color:var(--dim); margin:0 0 22px; font-size:16px; }
  .toggle { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:4px; font-size:13px; }
  .toggle span { padding:6px 16px; border-radius:999px; color:var(--dim); }
  .toggle .on { background:var(--accent); color:#fff; }
  .plans { display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; padding:30px 36px 20px; }
  .plan { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; }
  .plan.best { border-color:var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 20px 40px -20px #6b93ff66; }
  .plan h3 { margin:0 0 6px; font-size:15px; color:var(--dim); font-weight:600; }
  .price { font-size:34px; font-weight:700; margin:6px 0 2px; }
  .price small { font-size:14px; color:var(--dim); font-weight:400; }
  .plan ul { list-style:none; padding:0; margin:16px 0 20px; font-size:13.5px; line-height:2; color:#c9cdd8; }
  .plan li::before { content:"✓"; color:var(--accent); margin-right:8px; }
  .plan a { display:block; text-align:center; padding:10px; border-radius:9px; border:1px solid var(--line); color:var(--text); text-decoration:none; font-size:14px; }
  .plan.best a { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tag { float:right; font-size:11px; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:2px 8px; }
  footer { text-align:center; color:var(--dim); font-size:13px; padding:10px 0 40px; }
</style>
</head>
<body>
  <nav><b><i></i>Acme Cloud</b><span>Product</span><span>Docs</span><span>Pricing</span><span>Sign in</span></nav>
  <header>
    <h1>Simple pricing that scales</h1>
    <p>Start free. Upgrade when your team grows.</p>
    <div class="toggle"><span>Monthly</span><span class="on">Yearly · save 20%</span></div>
  </header>
  <section class="plans" id="plans"></section>
  <footer>All plans include SSO, audit logs and 99.9% uptime.</footer>
<script>
  const plans = [
    { name: "Starter", price: "$0", per: "forever", items: ["1 seat", "5 GB storage", "Community support"] },
    { name: "Team", price: "$24", per: "/ seat / mo", items: ["Up to 10 seats", "100 GB storage", "Preview deploys", "Email support"], best: true },
    { name: "Business", price: "$79", per: "/ seat / mo", items: ["Up to 50 seats", "1 TB storage", "Role-based access", "Priority support"] },
  ];
  document.getElementById("plans").innerHTML = plans.map((p) => `
    <article class="plan${p.best ? " best" : ""}">
      ${p.best ? '<span class="tag">Most popular</span>' : ""}
      <h3>${p.name}</h3>
      <div class="price">${p.price} <small>${p.per}</small></div>
      <ul>${p.items.map((i) => `<li>${i}</li>`).join("")}</ul>
      <a href="#">${p.best ? "Start free trial" : "Get started"}</a>
    </article>`).join("");
</script>
</body>
</html>
